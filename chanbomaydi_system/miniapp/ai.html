
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TIGRAN AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Inter,
                Arial,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top,
                    #142957 0%,
                    #070d1c 42%,
                    #03050b 100%
                );
        }

        .app {
            height: 100%;

            display: flex;
            flex-direction: column;

            max-width: 900px;

            margin: auto;
        }

        .header {
            min-height: 72px;

            padding: 13px 17px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom:
                1px solid
                rgba(100, 180, 255, 0.15);

            background:
                rgba(5, 10, 22, 0.72);

            backdrop-filter:
                blur(18px);
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 21px;
            font-weight: 800;

            letter-spacing: 1px;

            color: #71dcff;

            text-shadow:
                0 0 20px
                rgba(62, 194, 255, 0.4);
        }

        .subtitle {
            margin-top: 3px;

            font-size: 11px;

            color: #7d8ba9;
        }

        .logout {
            border:
                1px solid #263b61;

            background: #101a31;

            color: #a9b9d8;

            padding: 9px 13px;

            border-radius: 11px;

            cursor: pointer;
        }

        #messages {
            flex: 1;

            overflow-y: auto;

            padding: 22px 15px 130px;
        }

        .welcome {
            max-width: 520px;

            margin:
                70px auto 30px;

            text-align: center;
        }

        .welcome-logo {
            font-size: 36px;
            font-weight: 900;

            color: #70ddff;

            text-shadow:
                0 0 28px
                rgba(76, 197, 255, 0.45);
        }

        .welcome-text {
            margin-top: 13px;

            color: #8493b1;

            line-height: 1.5;
        }

        .message-row {
            display: flex;

            margin-bottom: 16px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 82%;

            padding: 13px 15px;

            border-radius: 17px;

            line-height: 1.48;

            font-size: 15px;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .bubble {
            color: #06101b;

            background:
                linear-gradient(
                    135deg,
                    #62dcff,
                    #8091ff
                );

            border-bottom-right-radius:
                5px;
        }

        .ai .bubble {
            color: #eaf3ff;

            background:
                rgba(17, 28, 52, 0.94);

            border:
                1px solid #22375d;

            border-bottom-left-radius:
                5px;
        }

        .typing {
            color: #7fdcff;
        }

        .composer-wrapper {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                12px 14px
                calc(
                    12px +
                    env(safe-area-inset-bottom)
                );

            background:
                linear-gradient(
                    transparent,
                    rgba(3, 6, 14, 0.96) 35%
                );
        }

        .composer {
            max-width: 850px;

            margin: auto;

            display: flex;
            align-items: flex-end;

            gap: 9px;

            padding: 9px;

            border:
                1px solid #25395e;

            border-radius: 20px;

            background:
                rgba(12, 20, 38, 0.96);

            box-shadow:
                0 0 35px
                rgba(45, 130, 255, 0.1);
        }

        textarea {
            flex: 1;

            min-height: 45px;
            max-height: 150px;

            resize: none;

            border: none;
            outline: none;

            padding: 12px;

            color: white;

            background: transparent;

            font-family: inherit;
            font-size: 15px;
        }

        textarea::placeholder {
            color: #677695;
        }

        #send {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border: none;
            border-radius: 14px;

            cursor: pointer;

            color: #05101b;

            font-size: 20px;
            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #59dbff,
                    #7d91ff
                );
        }

        #send:disabled {
            opacity: 0.45;

            cursor: default;
        }

        .error {
            color: #ff8498;
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="title">
                TIGRAN AI
            </div>

            <div class="subtitle">
                AI Workspace
            </div>

        </div>

        <button
            id="logout"
            class="logout"
        >
            Выйти
        </button>

    </header>


    <main id="messages">

        <div
            id="welcome"
            class="welcome"
        >

            <div class="welcome-logo">
                TIGRAN AI
            </div>

            <div class="welcome-text">
                Чем я могу помочь?
            </div>

        </div>

    </main>

</div>


<div class="composer-wrapper">

    <div class="composer">

        <textarea
            id="prompt"
            rows="1"
            maxlength="12000"
            placeholder="Сообщение TIGRAN AI..."
        ></textarea>

        <button
            id="send"
            aria-label="Отправить"
        >
            ↑
        </button>

    </div>

</div>

    <script
    type="module"
    src="/miniapp/js/auth-guard.js"
></script>


<script
    type="module"
    src="/miniapp/js/ai.js"
></script>

</body>
</html>
